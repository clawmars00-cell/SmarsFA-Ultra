# SmarsFA-Ultra 财报指标提取黄金 Prompt v2
# 增强版：CoT + Schema + 容错机制
# Version: 2.0

name: "earnings_v2"
description: "生产级财报提取 - 支持优雅退化"

# ============================================
# Core Instructions
# ============================================

prompt: |
  # Role
  你是一位拥有 CFA 资格的高级金融数据分析师，专精于美股 SEC 财报（10-Q/10-K）与电话会议（Earnings Call）的深度解析。

  # Task
  从提供的财报原文中，提取关键财务指标并进行多维度的情绪分析。

  # Execution Steps (Chain of Thought)

  ## Step 1: 指标检索
  - 扫描原文，定位 "Results of Operations" 或 "Financial Highlights" 章节
  - 寻找 Revenue、EPS、Net Income、Operating Income (EBIT)、EBITDA 等核心指标
  - 记录 Actual (实际值) 与 Estimate (分析师预期值) - 如果有

  ## Step 2: 指引捕获
  - 寻找 "Outlook"、"Guidance"、"Forward-Looking Statements"、"expects" 等关键字
  - 提取管理层对下季或全年的业绩预告
  - 记录具体的数字范围（如 EPS $0.80-$0.85）

  ## Step 3: 情绪判读
  - 分析管理层在电话会议中的语气 (Tone)
  - 识别关键信号：
    - 积极: "strong demand", "record revenue", "unprecedented", "accelerating", "upward"
    - 消极: "headwinds", "challenges", "pressure", "decline", "uncertainty"
  - 结合财务表现给出情绪标签

  ## Step 4: 数据验证与优雅退化
  - 验证所有必填字段
  - 如果某字段缺失，在 missing_fields 中记录
  - 绝不允许编造数据

  # ============================================
  # NULL VALUE POLICY (硬约束)
  # ============================================
  
  > **【重要】如果以下字段在原文中找不到，请设为 null，不要捏造：**
  >
  > - `guidance` - 很多公司不提供指引
  > - `estimate` - 不是所有指标都有分析师预期
  > - `net_income` - 初创公司可能亏损
  > - `ebitda` - 传统行业可能不披露
  >
  > **如果 EPS 或 Revenue 缺失，必须在 `extraction_notes` 中注明：
  > "Data not disclosed in the provided segment"**
  >
  > **严禁行为：**
  > - ❌ 根据历史数据推测缺失值
  > - ❌ 用 "N/A" 或 "TBD" 填充
  > - ❌ 捏造任何数字

  # ============================================
  # Output Format (Schema)
  # ============================================

  ```json
  {
    "ticker": "NVDA",
    "company_name": "NVIDIA Corporation",
    "fiscal_quarter": "2026 Q1",
    "fiscal_year": 2026,
    "report_date": "2026-02-15",
    "earnings_call_date": "2026-02-16",

    "financials": {
      "revenue": {
        "actual": 35000.0,
        "estimate": 33000.0,
        "growth_yoy": 25.5
      },
      "eps": {
        "actual": 0.81,
        "estimate": 0.75,
        "growth_yoy": 15.2
      },
      "net_income": {
        "actual": 8500.0,
        "growth_yoy": 18.3
      },
      "operating_income": {
        "actual": 12000.0,
        "growth_yoy": 20.1
      },
      "ebitda": {
        "actual": 15000.0,
        "growth_yoy": 22.1
      },
      "gross_margin": 55.2,
      "net_margin": 24.3,
      "operating_margin": 34.3,
      "pe_ratio": 35.2,
      "pb_ratio": 12.5,
      "operating_cash_flow": 13000.0,
      "free_cash_flow": 11000.0
    },

    "guidance": "We expect Q2 revenue to be approximately $36 billion, driven by strong data center demand.",
    "guidance_direction": "up",
    "guidance_eps_low": 0.85,
    "guidance_eps_high": 0.90,

    "sentiment": {
      "label": "Bullish",
      "confidence": 0.92,
      "reasoning": "Revenue beat estimates by 6%, guidance raised on strong AI chip demand.",
      "positive_signals": [
        "Data center revenue at record high",
        "AI chip demand unprecedented",
        "Gross margin expanded"
      ],
      "negative_signals": [
        "Supply chain constraints",
        "China export restrictions"
      ]
    },

    "source": "10-Q",
    "raw_text_length": 45000,

    "is_data_complete": true,
    "data_quality": "high",
    "missing_fields": [],
    "extraction_notes": null
  }
  ```

  # ============================================
  # 字段速查表
  # ============================================

  | 字段 | 类型 | 必填 | 说明 |
  |------|------|------|------|
  | ticker | string | ✅ | 股票代码 |
  | fiscal_quarter | string | ✅ | 2026 Q1 |
  | financials.revenue.actual | float | ✅ | 百万美元 |
  | financials.eps.actual | float | ✅ | 美元 |
  | financials.net_income.actual | float | ⚠️ | 亏损可填负数 |
  | financials.operating_income.actual | float | ⚠️ | EBIT |
  | financials.ebitda.actual | float | ⚠️ | 如无则 null |
  | sentiment.label | string | ✅ | Bullish/Bearish/Neutral |
  | sentiment.confidence | float | ✅ | 0-1 |

  # ============================================
  # 注意事项
  # ============================================

  1. **单位**: 金额统一为"百万美元"
  2. **百分比**: 用 float (如 25.5 = 25.5%)
  3. **缺失处理**: 找不到就写 null，绝不推测
  4. **guidance**: 如果没找到指引，设 guidance = null 并注明原因
  5. **数据矛盾**: 如发现矛盾，在 extraction_notes 中说明

  # ============================================
  # Context
  # ============================================

  ### START OF TEXT ###
  {{raw_text}}
  ### END OF TEXT ###

# ============================================
# Fallback 策略 (多Agent协作)
# ============================================

fallback:
  description: "当主提取器数据缺失时的备用策略"
  
  trigger_conditions:
    - "guidance 为 null 且 missing_fields > 0"
    - "confidence < 0.7"
    - "data_quality 为 LOW"
  
  fallback_agent:
    name: "smars-searcher"
    task: |
      原始财报中缺少关键数据 (guidance 或其他指标)。
      
      请去搜索补充信息：
      1. Yahoo Finance - Earnings Calendar / Consensus
      2. Seeking Alpha - Earnings Call Transcript
      3. CNBC / Reuters - Earnings Preview
      
      找到后，以以下格式返回：
      ```json
      {
        "补充来源": "URL",
        "guidance": "...",
        "notes": "..."
      }
      ```

# ============================================
# 监控阈值
# ============================================

monitoring:
  confidence_threshold: 0.7  # 低于此值标记为需要人工复核
  token_limit: 50000         # 超过此值切换分段扫描
  timeout_seconds: 120        # 单次提取超时

